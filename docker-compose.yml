services:
  coupon-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DB_URL: jdbc:postgresql://postgres:5432/coupon
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: coupon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"